<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS Demo</title>
  <style>
    body  { font-family: sans-serif; background: #0061a1; color: #000000; }
    h1    { color: #c8b3cd; font-size: 2rem; }
    p     { max-width: 55ch; line-height: 1.7; }
  </style>
</head>
<body>
  <h1>Hello, CSS!</h1>
  <p>This heading is green and the background is light blue — all controlled by CSS, not HTML.</p>
</body>
</html>
