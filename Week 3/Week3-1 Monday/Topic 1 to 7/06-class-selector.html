<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Class Selector Demo</title>
  <style>
    .card {
      border: 1px solid #003e8e92;
      border-radius: 8px;
      padding: 20px;
      margin: 10px;
      font-family: sans-serif;
    }
    .featured {
      border-color: #eaff00;
      background: #ffa200;
    }
    .large { font-size: 1.25rem; }
  </style>
</head>
<body>
  <div class="card">Plain card</div>
  <div class="card featured">Featured card (two classes)</div>
  <div class="card featured large">Featured + large (three classes)</div>
</body>
</html>
