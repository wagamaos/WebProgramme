<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>04 - textContent</title>
  <style>
    body { font-family: Arial, sans-serif; background: #fff7eb; padding: 30px; }
    .card { max-width: 700px; margin: 0 auto; background: white; border-radius: 12px; padding: 24px; box-shadow: 0 12px 26px rgba(0,0,0,0.08); }
    #textBox { font-size: 26px; color: #a85b00; font-weight: bold; }
    textarea, button { display: block; width: 100%; margin-top: 12px; font-size: 16px; }
    textarea { min-height: 100px; padding: 10px; }
    button { background: #ff9f1c; border: none; border-radius: 8px; padding: 12px; color: white; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h1>04. textContent</h1>
    <p id="textBox">Hello, Web Programming!</p>

    <textarea id="userInput" placeholder="Type text here...">&lt;b&gt;This is plain text, not HTML&lt;/b&gt;</textarea>
    <button id="updateBtn">Update Text</button>
  </div>

  <script>
    const textBox = document.getElementById('textBox');
    const userInput = document.getElementById('userInput');

    document.getElementById('updateBtn').addEventListener('click', () => {
      textBox.textContent = userInput.value;
    });
  </script>
</body>
</html>
