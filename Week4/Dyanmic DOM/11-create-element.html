<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>11 - createElement & appendChild</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f9ff; padding: 30px; }
    .card { max-width: 700px; margin: 0 auto; background: white; border-radius: 12px; padding: 24px; box-shadow: 0 10px 26px rgba(0,0,0,0.08); }
    ul { padding-left: 20px; }
    button { background: #0d9ad7; color: white; border: none; border-radius: 8px; padding: 10px 16px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h1>11. createElement & appendChild</h1>
    <ul id="myList">
      <li>Learn HTML</li>
      <li>Learn CSS</li>
    </ul>
    <button id="addItemBtn">+ Add Item</button>
  </div>

  <script>
    const list = document.getElementById('myList');
    const addItemBtn = document.getElementById('addItemBtn');

    addItemBtn.addEventListener('click', () => {
      const item = document.createElement('li');
      item.textContent = 'New item added dynamically';
      item.classList.add('list-item');
      list.appendChild(item);
    });
  </script>
</body>
</html>
