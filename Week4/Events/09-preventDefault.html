<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>09 - preventDefault</title>
  <style>
    body { font-family: Arial, sans-serif; background: #eefcf6; padding: 30px; }
    .card { max-width: 600px; margin: 0 auto; background: white; border-radius: 12px; padding: 24px; box-shadow: 0 10px 26px rgba(0,0,0,0.08); }
    form { display: flex; flex-direction: column; gap: 12px; }
    input, button { padding: 10px; font-size: 16px; }
    button { background: #1e9d63; color: white; border: none; border-radius: 8px; cursor: pointer; }
    #message { margin-top: 12px; color: #186c4c; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <h1>09. preventDefault</h1>
    <form id="loginForm">
      <input type="email" id="emailInput" placeholder="Enter your email" required />
      <button type="submit">Submit</button>
    </form>
    <div id="message"></div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('emailInput');
    const message = document.getElementById('message');

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const email = emailInput.value.trim();

      if (!email.includes('@')) {
        message.textContent = 'Please enter a valid email.';
        message.style.color = 'crimson';
      } else {
        message.textContent = 'Form submitted without page reload!';
        message.style.color = '#186c4c';
      }
    });
  </script>
</body>
</html>
